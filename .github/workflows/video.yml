name: Reconstruct moving parts from video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video.yml'
      - 'reconstruct_video.py'
      - 'video_parts.py'
      - 'video_camera.py'
      - 'video_calibration.py'
      - 'video_depth.py'
      - 'video_shape.py'
      - 'video_bundle.py'
      - 'server.py'
      - 'scripts/verify_video.mjs'
      - 'scripts/video_quality.py'
      - 'scripts/make_video_example.py'
  workflow_dispatch:
    inputs:
      video_path:
        description: Repository path to the video (MP4, MOV or WebM)
        type: string
        default: videos/input.mp4
        required: true
      parts_path:
        description: Repository path to the first-frame part boxes (JSON)
        type: string
        default: videos/parts.json
        required: true
      camera:
        description: Camera motion in the input video
        type: choice
        options: [fixed, moving]
        default: fixed
      sampling:
        description: Frame sampling for your clip
        type: choice
        options: [standard, dense]
        default: standard
      horizontal_fov_deg:
        description: Optional calibrated horizontal field of view in degrees for the cropped video
        type: string
        required: false
      use_example:
        description: Use the generated two-part video instead
        type: boolean
        default: false

permissions: {}

concurrency:
  group: video-reconstruction-${{ github.event_name == 'push' && 'sample-main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  reconstruct:
    name: CPU video reconstruction
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      USE_EXAMPLE: ${{ github.event_name == 'push' || inputs.use_example }}
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select video and boxes from the repository
        if: env.USE_EXAMPLE != 'true'
        shell: python
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
          PARTS_PATH: ${{ inputs.parts_path }}
        run: |
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          folder = Path(os.environ['RUNNER_TEMP']) / 'video-input'
          folder.mkdir()
          for key, basename, suffixes in [('VIDEO_PATH', 'video', {'.mp4', '.mov', '.webm'}),
                                          ('PARTS_PATH', 'parts', {'.json'})]:
              relative = Path(os.environ[key])
              path = (root / relative).resolve()
              if (relative.is_absolute() or not path.is_relative_to(root)
                      or not path.is_file() or path.suffix.lower() not in suffixes):
                  raise SystemExit(f'Choose a repository file of the requested type for {key}.')
              shutil.copyfile(path, folder / (basename + path.suffix.lower()))

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-inference.txt
            scripts/setup_cpu.py

      - run: python scripts/setup_cpu.py

      - name: Reconstruct selected video
        if: env.USE_EXAMPLE != 'true'
        shell: bash
        env:
          CAMERA: ${{ inputs.camera }}
          SAMPLING: ${{ inputs.sampling }}
          HFOV: ${{ inputs.horizontal_fov_deg }}
        run: |
          mkdir -p result
          inputs="$RUNNER_TEMP/video-input"
          options=(--camera "$CAMERA" --sampling "${SAMPLING:-standard}")
          if [[ -n "$HFOV" ]]; then options+=(--horizontal-fov-deg "$HFOV"); fi
          python reconstruct_video.py --video "$inputs"/video.* --parts "$inputs/parts.json" "${options[@]}" --output result/scene.json
          test -s result/scene.json

      - uses: actions/setup-node@v4
        if: env.USE_EXAMPLE == 'true'
        with:
          node-version: '22'

      - name: Install encoder for the generated browser demo
        if: env.USE_EXAMPLE == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Reconstruct the generated video through the web API
        if: env.USE_EXAMPLE == 'true'
        shell: bash
        run: |
          example="$RUNNER_TEMP/generated-video"
          python scripts/make_video_example.py --output-dir "$example"
          mkdir -p result
          python -u server.py > "$RUNNER_TEMP/video-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:7861/api/health
          published=docs/video-example
          if cmp -s "$example/video.mp4" "$published/video.mp4" && cmp -s "$example/parts.json" "$published/parts.json"; then
            export VIDEO_BASELINE_SCENE="$published/scene.json"
          fi
          VIDEO_QUALITY_REPORT=result/quality.json node scripts/verify_video.mjs "$example" result/scene.json

      - uses: actions/upload-artifact@v4
        with:
          name: mast3r-video-scene
          path: |
            result/scene.json
            result/quality.json
          if-no-files-found: error
          retention-days: 7

      # Only generated fixtures from main can populate the public viewer.
      - name: Prepare the example for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/public-video"
          cp result/scene.json result/quality.json "$RUNNER_TEMP/generated-video/video.mp4" "$RUNNER_TEMP/generated-video/parts.json" "$RUNNER_TEMP/public-video/"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: generated-public-video
          path: ${{ runner.temp }}/public-video/
          if-no-files-found: error
          retention-days: 1

  save-example:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reconstruct
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: save-generated-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: generated-public-video
          path: ${{ runner.temp }}/public-video/
      - name: Save just the generated demo
        shell: bash
        run: |
          mkdir -p docs/video-example
          for name in scene.json quality.json video.mp4 parts.json; do
            cp "$RUNNER_TEMP/public-video/$name" "docs/video-example/$name"
            git add -f -- "docs/video-example/$name"
          done
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update the generated moving-parts video example'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publish:
    needs: save-example
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/pages.yml
