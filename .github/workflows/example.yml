name: Build the four-photo courtyard example

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/example.yml']

permissions: {}

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-inference.txt
            scripts/setup_cpu.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/setup_cpu.py
      - name: Reconstruct through the web API and load the PLY in the viewer parser
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: '180'
        run: |
          python -u server.py > "$RUNNER_TEMP/web-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:7861/api/health
          node --experimental-default-type=module scripts/build-example.mjs
      - name: Save the example point cloud
        run: |
          git add -f docs/sample.ply
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update MASt3R point cloud from four ETH3D photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  publish:
    needs: generate
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/pages.yml
