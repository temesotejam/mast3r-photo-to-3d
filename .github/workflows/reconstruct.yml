name: Reconstruct photos with MASt3R

on:
  workflow_dispatch:
    inputs:
      photo_directory:
        description: Repository folder containing 2–10 overlapping photos
        required: true
        default: photos
        type: string
      use_example:
        description: Use the two official CroCo château pictures instead
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [.github/workflows/reconstruct.yml]

permissions:
  contents: read

jobs:
  reconstruct:
    name: CPU reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      HF_HUB_ETAG_TIMEOUT: "30"
      USE_EXAMPLE: ${{ github.event_name == 'push' || inputs.use_example }}
      PHOTO_DIRECTORY: ${{ inputs.photo_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select repository photos
        if: env.USE_EXAMPLE != 'true'
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          relative = Path(os.environ["PHOTO_DIRECTORY"])
          folder = (root / relative).resolve()
          if relative.is_absolute() or not folder.is_relative_to(root) or not folder.is_dir():
              raise SystemExit("Choose a photo directory inside this repository.")
          images = sorted(p for p in folder.iterdir() if p.is_file()
                          and p.suffix.lower() in {".jpg", ".jpeg", ".png", ".webp"})
          if not 2 <= len(images) <= 10:
              raise SystemExit(f"Choose a folder with 2 to 10 photos. Found {len(images)}.")
          output = Path(os.environ["RUNNER_TEMP"]) / "mast3r-photos"
          output.mkdir()
          for i, path in enumerate(images):
              if not path.resolve().is_relative_to(root):
                  raise SystemExit("A photo points outside this repository.")
              shutil.copyfile(path, output / f"{i:02d}{path.suffix.lower()}")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-inference.txt
            scripts/setup_cpu.py

      - name: Install CPU inference environment
        run: |
          bash -n scripts/start-codespace.sh
          python scripts/setup_cpu.py

      - name: Select official example
        if: env.USE_EXAMPLE == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mast3r-photos"
          cp vendor/mast3r/dust3r/croco/assets/Chateau{1,2}.png "$RUNNER_TEMP/mast3r-photos/"

      - name: Reconstruct colored point cloud
        shell: bash
        run: |
          mkdir -p result
          python reconstruct.py --input "$RUNNER_TEMP/mast3r-photos" --output result/cloud.ply --device cpu --mast3r-dir vendor/mast3r

      - uses: actions/upload-artifact@v4
        with:
          name: mast3r-point-cloud
          path: result/cloud.ply
          if-no-files-found: error
          retention-days: 7
